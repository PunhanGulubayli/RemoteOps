id: S02
ad: "Ana fan durdu - acil durum"
aciklama: >
  Ana fan elektrik arizasi nedeniyle durdu. Basinc kaynagi yok, sebeke cokuyor.
  Metan tum arinlarda hizla birikmeye basliyor. Operator fani yeniden baslatmali,
  konveyoru durdurmali (atesleme kaynagi) ve sump'i kontrol altinda tutmali.
sure_sn: 240

olaylar:
  - t: 30
    tip: ariza
    ad: "ANA FAN DURDU (elektrik arizasi)"
    etki: { hedef: "fan.ana_1", emr: "dayandir" }

ekran: hava

gorevler:
  - ad: "Fan arizasinda acil durum prosedurunu uygula"
    aciklama: >
      Ana fan durdu. Hava akisi yok, metan birikiyor. Once ATESLEME KAYNAGINI
      kaldirin, sonra fani yeniden baslatin.
    ekran: hava
    ekran_ad: "HAVALANDIRMA"
    adimlar:
      - metin: "Konveyoru durdurun (atesleme kaynagini kaldirin)"
        hedef: "CV01"
        ipucu: "Metan birikirken elektrikli ekipman atesleme kaynagidir."
        tamam: { etiket: "motor.CV01.durum", deger: "dayandi" }
      - metin: "Ana fani yeniden baslatin"
        hedef: "ana_1"
        ipucu: "Fan sembolune tiklayin, BASLAT deyin."
        tamam: { etiket: "fan.ana_1.durum", deger: "isliyir" }
      - metin: "Ocak debisinin normale dondugunu dogrulayin (>100 m3/s)"
        ipucu: "Fan basinci kurulunca debi saniyeler icinde geri gelir."
        tamam: { etiket: "fan.ana_1.debi", ust: 100 }

optimal:
  - t_hedef: 60
    ad: "Konveyor durduruldu (atesleme kaynagi kaldirildi)"
    kontrol: { hedef: "motor.CV01", emr: "dayandir" }
  - t_hedef: 75
    ad: "Ana fan yeniden baslatildi"
    kontrol: { hedef: "fan.ana_1", emr: "basla" }

basari:
  - { etiket: "fan.ana_1.debi", kosul: "ust", deger: 100.0 }
  - { etiket: "qaz.ch4.ARIN_2", kosul: "alt", deger: 1.0 }
